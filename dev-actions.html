<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>actions</title></head>
<body>
<pre id="out">…</pre>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script>
(function () {
  const AO = window.AgentOffice;
  const engine = new AO.Engine("launch");
  const report = [];
  for (let i = 0; i < 40; i++) engine.step();
  const injected = engine.injectEvent();
  report.push({ step: "inject during run", task: injected.title, taskCount: engine.world.tasks.length });
  let i = 0;
  while (!engine.world.done && i < 300) { engine.step(); i++; }
  report.push({
    step: "finish after inject",
    done: engine.world.done,
    extraTicks: i,
    injectedStatus: engine.world.tasks.filter(function (t) { return t.id.charAt(0) === "x"; }).map(function (t) { return t.status; })
  });
  const injected2 = engine.injectEvent();
  report.push({ step: "inject after done", task: injected2.title, doneFlag: engine.world.done });
  let j = 0;
  while (!engine.world.done && j < 300) { engine.step(); j++; }
  report.push({
    step: "finish after post-done inject",
    done: engine.world.done,
    extraTicks: j,
    statuses: engine.world.tasks.filter(function (t) { return t.id.charAt(0) === "x"; }).map(function (t) { return t.status; })
  });
  const meeting = engine.callMeeting("测试会议", "仅用于自检");
  report.push({ step: "meeting after done", accepted: meeting });
  document.getElementById("out").textContent = JSON.stringify(report, null, 2);
  document.title = report[1].done && report[3].done ? "PASS" : "FAIL";
})();
</script>
</body>
</html>
