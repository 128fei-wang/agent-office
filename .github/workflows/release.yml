name: Publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1].removeprefix("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          if not match:
              raise SystemExit(f"no CHANGELOG section for {version}")
          pathlib.Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(cat release-notes.md)"
          title="Agent Office ${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$title" \
            --notes "$notes" \
            --latest
