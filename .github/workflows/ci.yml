name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax
        run: python -m py_compile bridge.py updater.py missions.py

      - name: JavaScript syntax
        run: |
          set -eu
          for f in src/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Bridge integration tests
        run: python -m unittest discover -s tests -v

      - name: Repository checks
        run: bash scripts/check.sh
