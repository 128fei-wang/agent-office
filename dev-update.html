<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>Updater self-check</title>
<style>
body{background:#0b1118;color:#cfe0ee;font:12px/1.6 ui-monospace,Menlo,monospace;padding:14px}
iframe{position:fixed;left:-3800px;top:0;width:1440px;height:900px;border:0}
pre{white-space:pre-wrap;background:#121c26;border:1px solid #233545;border-radius:8px;padding:12px}
</style></head>
<body>
<h1>SELF UPDATE SELF-CHECK</h1>
<pre id="out">running…</pre>
<iframe id="f"></iframe>
<script>
(function(){
  const out=document.getElementById('out'),lines=[];let failed=0;
  function check(n,ok,extra){lines.push((ok?'PASS':'FAIL')+'  '+n+(extra?'  '+extra:''));if(!ok)failed++;}
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}
  function finish(){out.textContent=lines.join('\n')+'\n\n'+(failed?'FAILED: '+failed:'ALL CHECKS PASS');document.title=failed?'FAIL':'PASS';document.body.setAttribute('data-result',failed?'fail':'pass');}
  const f=document.getElementById('f');
  f.src='index.html?intro=0&ticks=0&noStream=1&update=0&noUpdateReload=1&theme=day&lang=zh';
  f.addEventListener('load',()=>setTimeout(()=>run().catch(err=>{lines.push('FAIL  exception '+((err&&err.stack)||err));failed++;finish();}),2400));
  async function run(){
    const d=f.contentDocument,w=f.contentWindow,app=w.AgentOfficeApp;
    const $=(s)=>d.querySelector(s);
    check('app exposed',!!app);
    if(!app){finish();return;}
    check('update center constructed',!!app.renderer.update);
    check('update button rendered',!!$('#updateBtn'));
    const btn=$('#updateBtn');
    check('update button labelled',/升级/.test(btn.textContent));
    const fake={
      bootId:'boot-old', version:'1.3.0', applyCalls:0, checkCalls:0,
      statusCalls:0, restarting:false,
      release:{tag:'v9.9.9',version:'9.9.9',name:'Agent Office v9.9.9',
        notes:'Mock release notes for the self-check.',url:'https://example.test/releases/v9.9.9',
        publishedAt:'2026-11-25T00:00:00Z'},
    };
    const realFetch=w.fetch.bind(w);
    function json(data,status){
      return Promise.resolve(new w.Response(JSON.stringify(data),{
        status:status||200,headers:{'Content-Type':'application/json'}
      }));
    }
    w.fetch=function(input,init){
      const url=typeof input==='string'?input:(input&&input.url)||'';
      if(url.indexOf('/update/check')>=0){
        fake.checkCalls++;
        return json({currentVersion:'1.3.0',latestVersion:'9.9.9',updateAvailable:true,
          release:fake.release,deployment:{mode:'archive',isGit:false,dirty:false,
          branch:'',canApply:true,reason:''},
          backup:{id:'backup-1',version:'1.2.0',createdAt:'2026-11-24T00:00:00Z'},
          checkedAt:'2026-11-25T05:00:00Z',
          repo:'128fei-wang/agent-office',token:'apply-token',rollbackToken:'rollback-token'});
      }
      if(url.indexOf('/update/apply')>=0){
        fake.applyCalls++;
        return json({ok:true,job:{status:'running',stage:'preparing',percent:5,
          message:'preparing',toVersion:'9.9.9',fromVersion:'1.3.0'}},202);
      }
      if(url.indexOf('/update/status')>=0){
        fake.statusCalls++;
        if(fake.statusCalls===1)return json({status:'running',stage:'extracting',percent:55,
          message:'extracting',toVersion:'9.9.9',fromVersion:'1.3.0',bootId:'boot-old'});
        fake.restarting=true;fake.bootId='boot-new';fake.version='9.9.9';
        return json({status:'restarting',stage:'restarting',percent:100,
          message:'restarting',toVersion:'9.9.9',fromVersion:'1.3.0',bootId:'boot-old'});
      }
      if(url.indexOf('/health')>=0){
        return json({ok:true,service:'agent-office-bridge',version:fake.version,
          bootId:fake.bootId,agents:0,events:0});
      }
      return realFetch(input,init);
    };
    btn.click();
    await wait(600);
    check('modal opens',!$('#updateModal').hidden);
    const shell=()=>$('#updateModal').textContent;
    check('check request issued',fake.checkCalls===1,'calls='+fake.checkCalls);
    check('latest version shown',/9\.9\.9/.test(shell()));
    check('update available shown',/发现新版本/.test(shell()));
    check('release notes shown',/Mock release notes/.test(shell()));
    check('backup shown',/可回滚备份/.test(shell())&&/1\.2\.0/.test(shell()));
    check('rollback control rendered',!!$('[data-update-action="rollback"]'));
    const apply=$('[data-update-action="apply"]');
    check('apply control rendered',!!apply);
    if(!apply){finish();return;}
    apply.click();
    await wait(120);
    check('confirmation shown',/确认升级/.test(shell()));
    const confirm=$('[data-update-action="confirm-apply"]');
    check('confirm control rendered',!!confirm);
    if(!confirm){finish();return;}
    confirm.click();
    await wait(400);
    check('apply request issued',fake.applyCalls===1,'calls='+fake.applyCalls);
    check('progress shown',/55%|正在处理|下载|解压/.test(shell()));
    for(let i=0;i<12&&!/升级完成/.test(shell());i++) await wait(350);
    check('bridge restart detected',fake.restarting===true);
    check('completion shown',/升级完成/.test(shell()),shell().slice(-120));
    check('error not shown',!/升级失败/.test(shell()));
    d.getElementById('langBtn').click();
    await wait(300);
    check('update UI switches to English',/Agent Office update/.test(shell())&&/Update complete/.test(shell()),shell().slice(0,100));
    d.querySelector('[data-update-close]').click();
    await wait(100);
    check('modal closes',$('#updateModal').hidden);
    finish();
  }
})();
</script>
</body></html>
