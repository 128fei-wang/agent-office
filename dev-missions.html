<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>Mission workspace self-check</title>
<style>
body{background:#0b1118;color:#cfe0ee;font:12px/1.6 ui-monospace,Menlo,monospace;padding:14px}
iframe{position:fixed;left:-3800px;top:0;width:1440px;height:900px;border:0}
pre{white-space:pre-wrap;background:#121c26;border:1px solid #233545;border-radius:8px;padding:12px}
</style></head>
<body>
<h1>MISSION WORKSPACE SELF-CHECK</h1>
<pre id="out">running…</pre>
<iframe id="f"></iframe>
<script>
(function(){
  const out=document.getElementById('out'),lines=[];let failed=0;
  function check(n,ok,extra){lines.push((ok?'PASS':'FAIL')+'  '+n+(extra?'  '+extra:''));if(!ok)failed++;}
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}
  let watchdog=null;
  function finish(){if(watchdog){clearTimeout(watchdog);watchdog=null;}out.textContent=lines.join('\n')+'\n\n'+(failed?'FAILED: '+failed:'ALL CHECKS PASS');document.title=failed?'FAIL':'PASS';document.body.setAttribute('data-result',failed?'fail':'pass');}
  const f=document.getElementById('f');
  f.src='index.html?intro=0&ticks=0&noStream=1&missions=1&theme=day&lang=zh';
  f.addEventListener('load',()=>setTimeout(()=>run().catch(err=>{lines.push('FAIL  exception '+((err&&err.stack)||err));failed++;finish();}),2600));
  async function run(){
    watchdog=setTimeout(function(){lines.push('FAIL  watchdog timeout 75s');failed++;finish();},75000);
    const d=f.contentDocument,w=f.contentWindow,app=w.AgentOfficeApp;
    const $=(s)=>d.querySelector(s);
    check('app exposed',!!app);
    if(!app){finish();return;}
    const view=app.renderer.missions, ext=app.renderer.external, bridge=ext.bridgeUrl;
    check('mission view constructed',!!view);
    check('mission button rendered',!!$('#missionBtn')&&/任务/.test($('#missionBtn').textContent));
    check('mission overlay opens',!$('#missionLab').hidden);
    const title='自检任务 '+Date.now().toString().slice(-6);
    $('#missionBtn').click();
    await wait(300);
    $('[data-mission-new="mission"]').click();
    await wait(200);
    const form=$('#missionCreateForm');
    check('mission form opens',!!form);
    if(!form){finish();return;}
    const templateBtn=$('[data-mission-template="ecom"]');
    check('mission quick templates',!!templateBtn);
    if(templateBtn){
      templateBtn.click();await wait(120);
      check('template fills title',/电商/.test(form.elements.title.value),form.elements.title.value);
      check('template fills acceptance',form.elements.acceptance.value.length>10);
      check('template has no token cap',!form.elements.tokenBudget);
    }
    form.elements.title.value=title;
    form.elements.description.value='为自检创建一条真实任务，包含文档和图片附件、任务规则、自动分配和审批。';
    form.elements.acceptance.value='任务群创建成功，所有成员有任务，附件可读取，审批可处理。';
    form.elements.description.dispatchEvent(new w.Event('input',{bubbles:true}));
    let picks=[];
    for(let i=0;i<8;i++){
      await wait(400);
      picks=Array.from(d.querySelectorAll('[data-team-agent]'));
      if(picks.length>=6)break;
    }
    check('agent picker rendered',picks.length>=6,'agents='+picks.length);
    const checkedPicks=Array.from(d.querySelectorAll('[data-team-agent]:checked'));
    check('no token cap field rendered',!form.elements.tokenBudget);
    check('token estimate note rendered',/Token 上限|预估|不设/.test(form.textContent));
    check('scheduled start field rendered',!!form.elements.scheduleAt);
    check('auto team preselected',checkedPicks.length>=2);
    const pickInfo=(id)=>(view.data.agents||[]).find(a=>a.id===id)||{};
    check('external agents recommended',checkedPicks.every(el=>pickInfo(el.getAttribute('data-team-agent')).source==='external'),
      checkedPicks.map(el=>el.getAttribute('data-team-agent')+':'+pickInfo(el.getAttribute('data-team-agent')).source).join(','));
    check('external recommendation scope',/外部/.test((d.querySelector('.mission-recommend-scope')||{}).textContent||''));
    check('recommended agent badge',!!d.querySelector('.mission-agent-pick.recommended'));
    check('agent logo marks',Array.from(d.querySelectorAll('.mission-agent-pick .mission-avatar')).filter(el=>el.textContent.trim()).length>=6);
    check('recommendation plan rendered',(d.querySelectorAll('.mission-plan-row').length||0)>=4);
    const firstPick=d.querySelector('[data-team-agent]:checked');
    let pickId='';
    if(firstPick){
      pickId=firstPick.getAttribute('data-team-agent');
      firstPick.click();
      await wait(120);
      check('free agent unselect',view.selectedAgents.indexOf(pickId)<0);
      const rePick=d.querySelector('[data-team-agent="'+pickId+'"]');
      if(rePick){rePick.click();await wait(120);}
      check('free agent reselect',view.selectedAgents.indexOf(pickId)>=0);
    }
    const execSelect=d.querySelector('[data-task-executor]');
    check('per-task executor selector',!!execSelect);
    let chosenKey='',chosenAgent='';
    if(execSelect){
      chosenKey=execSelect.getAttribute('data-task-executor');
      const alternate=Array.from(execSelect.options).find(o=>o.value!==execSelect.value&&o.value!==pickId) ||
        Array.from(execSelect.options).find(o=>o.value!==execSelect.value);
      if(alternate){
        execSelect.value=alternate.value;
        execSelect.dispatchEvent(new w.Event('change',{bubbles:true}));
        await wait(120);
        chosenAgent=alternate.value;
        check('per-task executor override',view.taskExecutors[chosenKey]===alternate.value);
      }
    }
    if(form.elements.autoRun)form.elements.autoRun.checked=false;
    await wait(1200);
    if(chosenKey)check('executor survives recommendation refresh',view.taskExecutors[chosenKey]===chosenAgent,
      chosenKey+'='+view.taskExecutors[chosenKey]+'/'+chosenAgent);
    const dt=new w.DataTransfer();
    dt.items.add(new w.File(['# 任务背景\n这是自检文档内容。\n'], 'brief.md', {type:'text/markdown'}));
    const png=Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2nNwAAAAASUVORK5CYII='),c=>c.charCodeAt(0));
    dt.items.add(new w.File([png], 'pixel.png', {type:'image/png'}));
    const fileInput=$('#missionCreateFiles');
    fileInput.files=dt.files;
    fileInput.dispatchEvent(new w.Event('change',{bubbles:true}));
    form.dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
    let mission=null;
    for(let i=0;i<20;i++){
      await wait(500);
      if(view.mission&&view.mission.title===title){mission=view.mission;break;}
    }
    check('mission created',!!mission,mission&&mission.id);
    if(!mission){finish();return;}
    check('group conversation created',!!mission.conversationId);
    check('auto tasks generated',(mission.tasks||[]).length>=4,'tasks='+(mission.tasks||[]).length);
    if(chosenKey&&chosenAgent){
      const chosenTask=(mission.tasks||[]).find(t=>t.key===chosenKey);
      check('per-task executor honored',!!chosenTask&&chosenTask.assigneeId===chosenAgent,
        chosenTask&&(chosenTask.key+'='+chosenTask.assigneeId+'/'+chosenAgent));
    }
    check('no idle coverage',mission.coverage&&mission.coverage.noIdle===true,JSON.stringify(mission.coverage));
    check('members assigned',(mission.members||[]).every(m=>(mission.tasks||[]).some(t=>t.assigneeId===m.id)));
    check('task estimates generated',(mission.tasks||[]).every(t=>t.estimate&&t.estimate.minutes>0&&t.estimate.tokens>0));
    check('mission evaluation generated',!!mission.evaluation&&mission.evaluation.estimatedTokens>0);
    check('task has no token cap',mission.tokenBudget===0,mission.tokenBudget);
    check('context insight generated',!!mission.contextInsight&&mission.contextInsight.estimatedTotalTokens>0);
    check('no budget in evaluation',mission.evaluation&&mission.evaluation.tokenBudget===0);
    check('member logos generated',(mission.members||[]).every(m=>!!m.logoText));
    view.detailTab='overview';view.render();await wait(120);
    check('AI settings shortcut',view.ai&&view.ai.available?true:!!d.querySelector('[data-mission-ai-settings]'));
    view.detailTab='eval';view.render();await wait(200);
    check('evaluation tab renders',/预计/.test($('.mission-detail-body').textContent)&&/Token/i.test($('.mission-detail-body').textContent));
    check('context insight panel rendered',!!$('.mission-context-card')&&/预估输入/.test($('.mission-detail-body').textContent));
    check('no token budget editor',!$('#missionTokenBudget')&&!$('[data-mission-budget-save]'));
    check('model cost panel rendered',/模型成本|Model cost/.test($('.mission-detail-body').textContent));
    const originalEval=mission.evaluation;
    mission.evaluation=Object.assign({},mission.evaluation||{},{modelCost:0.123,currency:'USD',pricedModelCalls:2});
    view.render();await wait(100);
    check('priced model cost rendered',/\$0\.12/.test($('.mission-detail-body').textContent));
    mission.evaluation=originalEval;view.render();
    check('rules present',(mission.rules||[]).length>=5);
    check('document attachment stored',(mission.artifacts||[]).some(a=>a.name==='brief.md'&&/自检文档内容/.test(a.extractedText||'')));
    check('image attachment stored',(mission.artifacts||[]).some(a=>a.kind==='image'));
    const finished=JSON.parse(JSON.stringify(mission));
    finished.tasks.forEach(t=>{t.status='done';t.report={summary:'已完成 '+t.title,solution:'验证通过',next:['继续优化']};});
    finished.stats=Object.assign({},finished.stats,{progress:100,done:finished.tasks.length,review:0});
    finished.decisions=[{topic:'路线',outcome:'采用方案 A'}];
    finished.coverage={total:finished.members.length,assigned:finished.members.length,idle:[],noIdle:true,completed:true};
    const nextPayload=view.nextRoundPayload(finished);
    check('next round payload',!!nextPayload&&nextPayload.previousMissionId===mission.id);
    check('next round has no cap',nextPayload&&nextPayload.tokenBudget===0);
    check('next round title',!!nextPayload&&/第 2 轮/.test(nextPayload.title),nextPayload&&nextPayload.title);
    check('next round team',!!nextPayload&&nextPayload.memberIds.length===mission.members.length);
    check('next round artifacts',!!nextPayload&&(nextPayload.artifactIds||[]).length===(finished.artifacts||[]).length);
    check('next round context',!!nextPayload&&/上一轮/.test(nextPayload.description)&&/继续下一轮/.test(nextPayload.description));
    view.mission=finished;view.detailTab='overview';view.render();await wait(120);
    check('next round command action',!!d.querySelector('[data-mission-next-round]'));
    check('completed coverage no idle warning',/本轮已完成/.test(($('.mission-coverage')||{}).textContent||''));
    view.mission=mission;view.render();
    view.detailTab='tasks';view.render();await wait(120);
    check('task agent filter rendered',!!d.querySelector('[data-task-agent-filter]'));
    check('task progress bars rendered',d.querySelectorAll('.mission-task-progress').length>=mission.tasks.length);
    const filterMember=mission.members[0];
    view.taskAgentFilter=filterMember.id;view.render();await wait(120);
    const filteredRows=d.querySelectorAll('.mission-task').length;
    const expectedRows=mission.tasks.filter(t=>t.assigneeId===filterMember.id).length;
    check('task filter by agent',filteredRows===expectedRows,filteredRows+'/'+expectedRows);
    view.taskAgentFilter='';view.detailTab='members';view.render();await wait(120);
    check('member progress bar',!!d.querySelector('.mission-member-progress'));
    check('member view tasks action',!!d.querySelector('[data-member-tasks]'));
    const memberTasksBtn=d.querySelector('[data-member-tasks]');
    if(memberTasksBtn){memberTasksBtn.click();await wait(150);}
    check('member action filters tasks',view.taskAgentFilter===filterMember.id);
    const patchTarget=mission.tasks.find(t=>t.status!=='done');
    if(patchTarget){
      await view.patchTask(patchTarget.id,{status:'review',progress:73});
      await wait(900);
      const patched=(view.mission&&view.mission.tasks||[]).find(t=>t.id===patchTarget.id);
      check('task status patched from UI',!!patched&&patched.status==='review',patched&&patched.status);
      check('task progress persisted',!!patched&&Number(patched.progress)===73,patched&&patched.progress);
      view.detailTab='tasks';view.taskAgentFilter='';view.render();await wait(150);
      check('task accept action rendered',!!d.querySelector('[data-task-accept="'+patchTarget.id+'"]'));
      check('task reassign control rendered',!!d.querySelector('[data-task-reassign="'+patchTarget.id+'"]'));
      check('task block action rendered',!!d.querySelector('[data-task-block="'+patchTarget.id+'"]'));
      check('task rerun method exists',typeof view.rerunTask==='function');
      check('task verify method exists',typeof view.verifyTask==='function');
      check('task verification panel rendered',!!d.querySelector('.mission-verification'));
      const verifyBtn=d.querySelector('[data-task-verify="'+patchTarget.id+'"]');
      check('task verify action rendered',!!verifyBtn);
      if(verifyBtn){
        await view.verifyTask(patchTarget.id);
        await wait(900);
        const verified=(view.mission&&view.mission.tasks||[]).find(t=>t.id===patchTarget.id);
        check('task verification persisted',!!verified&&!!verified.verification,verified&&verified.verification&&verified.verification.status);
        check('task without files fails honestly',!!verified&&verified.verification&&verified.verification.status==='failed');
        view.detailTab='tasks';view.render();await wait(120);
        check('verification evidence in UI',/交付验证|Verification/.test(($('.mission-verification')||{}).textContent||''));
        check('task verification mark rendered',!!d.querySelector('.mission-verify-mark'));
        check('task verification summary rendered',!!d.querySelector('.mission-verify-summary'));
        const diffTarget=(view.mission&&view.mission.tasks||[]).find(t=>t.id===patchTarget.id);
        if(diffTarget){
          const originalDiff=diffTarget.diff;
          diffTarget.diff={changed:1,added:2,removed:1,files:[{name:'src/app.py',status:'modified',added:2,removed:1,preview:'@@ -1 +1 @@\n-old\n+new'}]};
          view.detailTab='tasks';view.render();await wait(100);
          check('task diff evidence rendered',!!d.querySelector('.mission-diff'));
          diffTarget.diff=originalDiff;
          const originalTestRun=diffTarget.testRun;
          diffTarget.testRun={status:'passed',reason:'Python 测试通过',exitCode:0,durationMs:12,output:'OK',backend:'macos-seatbelt',runner:'python-unittest',command:'python -m unittest discover'};
          view.render();await wait(100);
          check('task test-run evidence rendered',!!d.querySelector('.mission-test-run.status-passed'));
          check('test sandbox backend rendered',/seatbelt|bubblewrap|sandbox/i.test(($('.mission-test-run')||{}).textContent||''));
          check('test runner rendered',/python-unittest/.test(($('.mission-test-run')||{}).textContent||''));
          const originalArtifactIds=diffTarget.artifactIds;
          const originalArtifacts=view.mission.artifacts;
          view.mission.artifacts=(originalArtifacts||[]).concat([{id:'artifact-ui-selfcheck',name:'test_ok.py',size:128,uploadedBy:diffTarget.assigneeId}]);
          diffTarget.artifactIds=['artifact-ui-selfcheck'];
          diffTarget.evidence=[{seq:1,source:'bridge-ai',agentId:diffTarget.assigneeId,agentName:diffTarget.assigneeName,payloadHash:'abcdef1234567890',attestation:{identityBasis:'local-member',identityVerified:true},artifacts:[{id:'artifact-ui-selfcheck',sha256:'deadbeef'}]}];
          view.render();await wait(100);
          check('custom test command rendered',!!d.querySelector('.mission-test-custom'));
          check('evidence receipts rendered',!!d.querySelector('.mission-receipts'));
          check('evidence verify action rendered',!!d.querySelector('[data-task-evidence-verify]'));
          check('evidence export action rendered',!!d.querySelector('[data-task-evidence-export]'));
          check('evidence verification methods exist',typeof view.verifyEvidence==='function'&&typeof view.exportEvidence==='function');
          diffTarget.evidence=[];
          diffTarget.artifactIds=originalArtifactIds;
          view.mission.artifacts=originalArtifacts;
          diffTarget.testRun=originalTestRun;
          view.render();
        }
      }
      const editBtn=d.querySelector('[data-task-edit="'+patchTarget.id+'"]');
      check('task edit action rendered',!!editBtn);
      if(editBtn){
        editBtn.click();await wait(150);
        const editForm=$('#missionTaskEditForm');
        check('task edit form opens',!!editForm);
        if(editForm){
          editForm.elements.title.value='自检任务已编辑';
          editForm.elements.brief.value='编辑后的任务说明';
          editForm.dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
          await wait(900);
          const edited=(view.mission&&view.mission.tasks||[]).find(t=>t.id===patchTarget.id);
          check('task title edited',!!edited&&edited.title==='自检任务已编辑',edited&&edited.title);
          check('task brief edited',!!edited&&edited.brief==='编辑后的任务说明');
          check('task edit closes',!$('#missionTaskEditForm'));
        }
      }
    }
    view.detailTab='tasks';view.taskAgentFilter='';view.render();await wait(150);
    const bulkTaskIds=[];
    for(let i=0;i<2;i++){
      const box=Array.from(d.querySelectorAll('[data-task-select]')).find(cb=>!cb.checked);
      if(!box)break;
      bulkTaskIds.push(box.getAttribute('data-task-select'));
      box.checked=true;box.dispatchEvent(new w.Event('change',{bubbles:true}));
      await wait(180);
      view.detailTab='tasks';view.render();await wait(120);
    }
    check('task bulk toolbar',!!$('.mission-task-bulk'),'ids='+bulkTaskIds.join(','));
    const blockBulk=$('[data-task-bulk="block"]');
    check('task bulk block action',!!blockBulk&&!blockBulk.disabled);
    if(blockBulk){blockBulk.click();await wait(1400);}
    const blockedTasks=(view.mission&&view.mission.tasks||[]).filter(t=>bulkTaskIds.includes(t.id)&&t.status==='blocked');
    check('bulk tasks blocked',blockedTasks.length===bulkTaskIds.length,blockedTasks.length+'/'+bulkTaskIds.length);
    view.selectedTasks.clear();
    view.taskAgentFilter='';view.detailTab='overview';view.render();
    const searchInput=$('#missionSearch');
    if(searchInput){
      searchInput.focus();searchInput.value='__no_such_mission__';
      searchInput.dispatchEvent(new w.Event('input',{bubbles:true}));
      await wait(150);
      check('mission search filters immediately',d.querySelectorAll('.mission-item').length===0);
      check('mission search keeps focus',d.activeElement===$('#missionSearch'));
      check('mission search empty state',/没有匹配/.test(($('.mission-side')||{}).textContent||''));
      view.search='';view.renderSidebarOnly();
    }
    view.detailTab='files';view.render();await wait(100);
    const downloadLink=d.querySelector('.mission-file-dl');
    check('file download link rendered',!!downloadLink,downloadLink&&downloadLink.getAttribute('href'));
    view.detailTab='overview';view.render();
    const doc=(mission.artifacts||[]).find(a=>a.name==='brief.md');
    if(doc){
      await view.openArtifact(doc.id);
      await wait(200);
      check('document preview opens',/自检文档内容/.test(($('.mission-artifact')||{}).textContent||''));
      const close=$('[data-artifact-close]');if(close)close.click();
    }
    const image=(mission.artifacts||[]).find(a=>a.kind==='image');
    if(image){
      await view.openArtifact(image.id);
      await wait(200);
      check('image preview opens',!!$('.mission-artifact img'));
      check('image OCR control',!!$('[data-artifact-vision]'));
      const close=$('[data-artifact-close]');if(close)close.click();
    }
    const draft=$('#missionDraft');
    draft.value='自检消息：请把方案和风险发到群里。';
    draft.dispatchEvent(new w.Event('input',{bubbles:true}));
    $('#missionChatForm').dispatchEvent(new w.Event('submit',{bubbles:true,cancelable:true}));
    await wait(900);
    check('group message sent',/自检消息/.test($('#missionMessages').textContent));
    const searchToggle=$('[data-message-search-toggle]');
    check('message search toggle',!!searchToggle);
    if(searchToggle){
      searchToggle.click();await wait(150);
      const searchBox=$('#missionMessageSearch');
      check('message search opens',!!searchBox);
      if(searchBox){
        searchBox.value='自检消息';
        searchBox.dispatchEvent(new w.Event('input',{bubbles:true}));
        await wait(100);
        const allRows=Array.from(d.querySelectorAll('#missionMessages > *'));
        const visible=allRows.filter(el=>!el.hidden&&!el.classList.contains('search-hidden'));
        check('message search filters',visible.length>=1&&visible.length<allRows.length,
          'visible='+visible.length+' total='+allRows.length);
        check('message search keeps focus',d.activeElement===searchBox);
        searchBox.value='__no_match__';
        searchBox.dispatchEvent(new w.Event('input',{bubbles:true}));
        await wait(100);
        check('message search empty state',!!$('.mission-search-empty'));
        $('[data-message-search-clear]').click();await wait(150);
        check('message search clears',!$('.mission-search-empty'));
      }
    }

    const report={
      summary:'需要授权域名预算', done:['完成调研'], next:['购买域名'],
      risks:['预算不足'], solution:'先买基础域名，后续升级',
      evidence:['brief.md'], needsBoss:['spend'],
      approval:{type:'spend',title:'自检域名预算',amount:88,currency:'CNY'}
    };
    const bad=await fetch(bridge+'/conversations/'+mission.conversationId+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({senderId:mission.members[0].id,senderType:'agent',type:'report',text:'technical',report:{summary:'x',done:['a'],next:['b'],risks:['c'],solution:'',needsBoss:['technical']}})});
    check('report without solution rejected',bad.status===400,'status='+bad.status);
    const good=await fetch(bridge+'/conversations/'+mission.conversationId+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({senderId:mission.members[0].id,senderType:'agent',type:'report',text:'approval',report:report})});
    check('valid report accepted',good.status===201,'status='+good.status);
    await view.selectMission(mission.id);
    await wait(400);
    check('boss gate rendered',/自检域名预算/.test($('#missionMessages').textContent)&&/花费/.test($('#missionMessages').textContent));
    const approve=Array.from(d.querySelectorAll('[data-approval-decision][data-approval-action="approved"]')).find(b=>/自检域名预算/.test((b.closest('.mission-approval')||{}).textContent||''));
    check('approval action rendered',!!approve);
    const beforeApprovals=await (await fetch(bridge+'/approvals')).json();
    const beforePending=(beforeApprovals.approvals||[]).find(a=>a.title==='自检域名预算');
    const approveButtons=Array.from(d.querySelectorAll('[data-approval-decision][data-approval-action="approved"]')).map(b=>b.getAttribute('data-approval-decision'));
    check('approval target pending',!!beforePending&&beforePending.status==='pending',
      beforePending&&(beforePending.id+':'+beforePending.status)+' buttons='+approveButtons.join(',')+' all='+(beforeApprovals.approvals||[]).map(a=>a.id+':'+a.status+':'+a.title).join(','));
    let approvalCalls=0;
    const originalResolve=view.resolveApproval.bind(view);
    view.resolveApproval=function(){approvalCalls++;return originalResolve.apply(null,arguments);};
    if(approve){approve.click();await wait(1200);}
    check('approval click handler called',approvalCalls>0,'calls='+approvalCalls+' busy='+view.resolvingApproval+' toast='+(($('#toast')||{}).textContent||''));
    const approvals=await (await fetch(bridge+'/approvals')).json();
    const mine=(approvals.approvals||[]).find(a=>a.title==='自检域名预算');
    check('approval resolved',!!mine&&mine.status==='approved',mine&&mine.status);
    $('[data-mission-approvals]').click();
    await wait(700);
    check('approval inbox filters rendered',d.querySelectorAll('[data-approval-filter]').length===3);
    const resolvedFilter=d.querySelector('[data-approval-filter="resolved"]');
    if(resolvedFilter){resolvedFilter.click();await wait(700);}
    check('resolved approval history loads',/自检域名预算/.test(($('.mission-inbox-list')||{}).textContent||''));
    check('approval context rendered',!!$('.mission-approval-context'));
    view.viewMode='chat';view.render();await wait(150);

    const bulkApprovalIds=[];
    for(const index of [1,2]){
      const res=await fetch(bridge+'/approvals',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({missionId:mission.id,type:'spend',title:'批量测试 '+index,
          amount:10+index,currency:'CNY',requestedBy:mission.members[0].id})});
      if(res.status===201){const data=await res.json();bulkApprovalIds.push((data.approval||{}).id);}
    }
    for(let i=0;i<12&&view.busy;i++)await wait(200);
    await view.refreshAll(false);
    await wait(500);
    view.viewMode='approvals';view.approvalFilter='pending';view.render();await wait(200);
    check('bulk approvals created',bulkApprovalIds.length===2,'ids='+bulkApprovalIds.join(','));
    check('bulk pending loaded',(view.data.approvals||[]).length>=2,'pending='+(view.data.approvals||[]).length);
    check('bulk approval toolbar',d.querySelectorAll('[data-approval-bulk]').length===2);
    const selectAll=d.querySelector('[data-approval-select-all]');
    check('bulk select all control',!!selectAll);
    if(selectAll){
      selectAll.checked=true;selectAll.dispatchEvent(new w.Event('change',{bubbles:true}));
      await wait(100);
      const approveBulk=d.querySelector('[data-approval-bulk="approved"]');
      check('bulk approve enabled',!!approveBulk&&!approveBulk.disabled);
      if(approveBulk)approveBulk.click();
      await wait(1600);
      const history=await (await fetch(bridge+'/approvals')).json();
      const resolved=(history.approvals||[]).filter(a=>bulkApprovalIds.includes(a.id)&&a.status==='approved');
      check('bulk approvals resolved',resolved.length===bulkApprovalIds.length,
        resolved.length+'/'+bulkApprovalIds.length);
    }
    view.viewMode='chat';view.render();await wait(150);

    // A running mission posts reports into the group; those must not kill the chat typing state.
    await view.selectConversation(mission.conversationId,'group');
    await wait(220);
    if(view.conversation){
      view.replyPending=true;
      view.replyPendingConversation=view.conversation.id;
      view.render();
      await wait(80);
      check('typing indicator shown',!!$('#missionMessages .mission-typing'));
      const reportMsg={id:'selftest-run',seq:999999,senderId:mission.members[0].id,
        senderName:mission.members[0].name,senderType:'agent',type:'text',
        text:'自动执行阶段汇报',meta:{autoRun:true},createdAt:new Date().toISOString()};
      view.appendMessage(reportMsg);
      check('typing survives auto-run report',!!$('#missionMessages .mission-typing'));
      const chatMsg={id:'selftest-chat-reply',seq:1000000,senderId:mission.members[0].id,
        senderName:mission.members[0].name,senderType:'agent',type:'text',
        text:'这是聊天回复',meta:{chatReply:true},createdAt:new Date().toISOString()};
      view.appendMessage(chatMsg);
      check('typing clears on chat reply',!$('#missionMessages .mission-typing'));
      view.replyPending=false;
      view.replyPendingConversation='';
      view.render();
      await wait(80);
    }

    const features=app.renderer.features;
    $('[data-mission-new="group"]').click();
    await wait(650);
    check('group entry opens chat workspace',!!$('.chat-window.chat-hub')&&!!d.querySelector('#chatGroupForm'));
    if(features.chat)features.chat.close();
    await view.open();await view.selectMission(mission.id);await wait(300);
    $('[data-mission-new="direct"]').click();
    await wait(600);
    check('direct entry opens chat workspace',!!$('.chat-window.chat-hub')&&/私聊/.test(($('.chat-side')||{}).textContent||''));
    if(features.chat)features.chat.close();
    await view.open();await view.selectMission(mission.id);await wait(300);
    const routeGroup=await (await fetch(bridge+'/conversations',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind:'group',title:'路由自检群',memberIds:mission.members.slice(0,2).map(m=>m.id)})})).json();
    const routeGroupId=routeGroup.conversation&&routeGroup.conversation.id;
    await view.refreshAll(false);view.sideTab='groups';view.render();await wait(200);
    const routeConv=d.querySelector('[data-mission-conv="'+routeGroupId+'"]');
    check('built group appears in group list',!!routeConv);
    if(routeConv){routeConv.click();await wait(700);}
    check('clicking built group opens chat workspace',!!$('.chat-window.chat-hub')&&(!$('#missionLab')||$('#missionLab').hidden));
    if(features.chat)features.chat.close();
    if(routeGroupId)await fetch(bridge+'/conversations/'+routeGroupId,{method:'DELETE'});
    await view.open();view.sideTab='missions';await view.selectMission(mission.id);await wait(300);
    $('[data-mission-chat-hub]').click();await wait(600);
    check('mission header opens chat workspace',!!$('.chat-window.chat-hub')&&!$('#chatGroupForm'));
    if(features.chat)features.chat.close();
    await view.open();view.sideTab='missions';await view.selectMission(mission.id);await wait(300);

    await view.selectMission(mission.id);await wait(400);
    await view.archiveMission();
    await wait(700);
    const archivedDetail=await (await fetch(bridge+'/missions/'+mission.id)).json();
    check('mission archive',!!archivedDetail.mission&&archivedDetail.mission.archived===true);
    view.missionFilter='archived';view.render();await wait(150);
    check('archived filter shows mission',d.querySelectorAll('.mission-item').length>=1);
    view.missionFilter='all';view.render();
    await view.duplicateMission();
    await wait(1000);
    const copyId=view.mission&&view.mission.id;
    check('mission duplicate created',!!copyId&&copyId!==mission.id,copyId);
    check('mission duplicate title',!!view.mission&&/副本|Copy/.test(view.mission.title),view.mission&&view.mission.title);
    if(copyId){await fetch(bridge+'/missions/'+copyId,{method:'DELETE'});}
    const del=await fetch(bridge+'/missions/'+mission.id,{method:'DELETE'});
    check('mission cleanup',del.status===200);
    const after=await (await fetch(bridge+'/missions')).json();
    check('mission removed',!(after.missions||[]).some(m=>m.id===mission.id||m.id===copyId));
    finish();
  }
})();
</script>
</body></html>
