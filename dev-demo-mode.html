<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8" /><title>Demo mode self-check</title>
<style>body{background:#0b1118;color:#cfe0ee;font:12px/1.6 ui-monospace,Menlo,monospace;padding:14px}iframe{position:fixed;left:-3800px;top:0;width:1440px;height:900px;border:0}pre{white-space:pre-wrap;background:#121c26;border:1px solid #233545;border-radius:8px;padding:12px}</style></head>
<body><h1>DEMO MODE SELF-CHECK</h1><pre id="out">running…</pre><iframe id="f"></iframe><script>
(function(){
  const out=document.getElementById('out'),lines=[];let failed=0;
  function check(n,ok,extra){lines.push((ok?'PASS':'FAIL')+'  '+n+(extra?'  '+extra:''));if(!ok)failed++;}
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}
  function finish(){out.textContent=lines.join('\n')+'\n\n'+(failed?'FAILED: '+failed:'ALL CHECKS PASS');document.title=failed?'FAIL':'PASS';document.body.setAttribute('data-result',failed?'fail':'pass');}
  try { localStorage.setItem('agent-office.demo-mode.v1','on'); } catch (err) {}
  const f=document.getElementById('f');
  f.src='index.html?intro=0&ticks=0&noStream=1&theme=night&lang=zh';
  f.addEventListener('load',()=>setTimeout(()=>run().catch(err=>{lines.push('FAIL  exception '+((err&&err.stack)||err));failed++;finish();}),3500));
  async function run(){
    const d=f.contentDocument,w=f.contentWindow,app=w.AgentOfficeApp,$=s=>d.querySelector(s),$$=s=>Array.from(d.querySelectorAll(s));
    check('app exposed',!!app);
    check('memorable product tagline',/看见 AI 团队|Watch an AI team/.test(($('.brand-tagline')||{}).textContent||''));
    check('tagline proof line',/谁在干|Who's on it/.test(($('.brand-proof')||{}).textContent||''));
    if(!app){finish();return;}
    const demo=w.AgentOffice.DemoMode;
    check('demo mode exposed',!!demo);
    check('demo mode starts on',!!demo&&demo.enabled);
    check('local characters initially visible',$$('.team-card[data-agent]').length>=6);
    check('demo mode tool in drawer',!!$('[data-feature-action="demo"]'));
    if(!demo){finish();return;}

    demo.setEnabled(false,{silent:true});
    await wait(900);
    check('html marks real mode',d.documentElement.dataset.demo==='off');
    check('simulation paused',!!app.engine.paused);
    check('cover stays closed by default',!!$('#realModeCover')&&$('#realModeCover').hidden);
    check('demo off lands in real workspace',!!$('#realOpsBtn')&&!$('#realOpsBtn').hidden&&!!$('#realMissionBtn'));
    check('real panel label available',/面板/.test(($('#realOpsBtn')||{}).textContent||''));
    check('preset team cards hidden',$$('.team-card[data-agent]').length===0);
    check('real office agent activity rendered',$$('.real-char').length>=1,'agents='+$$('.real-char').length);
    check('stage ambience layer',!!$('.ambience-layer'));
    check('char layer hidden by css',w.getComputedStyle($('.char-layer')).display==='none');
    check('top stats show real metrics',w.getComputedStyle($('.top-stats')).display!=='none'&&/\//.test(($('#statTasks')||{}).textContent||''));
    const live=w.AgentOffice.missionLive;
    const realAgent=app.renderer.external.agents[0];
    live.stop();
    live.applyOverview({approvals:[],missions:[{id:'real-anim-test',title:'真实动画测试',archived:false,
      stats:{tasks:8,done:2,progress:25,approvals:0},members:[realAgent],
      autoRun:{status:'running',currentAgentId:realAgent.id,currentTaskTitle:'真实任务动画',
        currentRole:'engineer',completed:2,total:8}}]});
    await wait(300);
    check('real active agent working',!!$('.real-char.is-working'));
    check('real active task bubble',/真实任务动画/.test(($('.real-char.is-working .rc-bubble.show')||{}).textContent||''));
    check('real active progress bar',!!$('.real-char.is-working .rc-progress.show'));
    check('real collaboration web',$$('.real-web-link').length>=1);
    check('real focus spotlight',!!$('.real-spotlight.show'));
    check('real mission cinema',!!$('.real-cinema.kind-start'));
    live.realDetail={id:'real-anim-test',artifacts:[],tasks:[
      {id:'ft1',title:'真实任务动画',status:'in_progress',progress:25,assigneeId:realAgent.id,assigneeName:realAgent.name},
      {id:'ft2',title:'失败回归测试',status:'review',progress:100,assigneeId:realAgent.id,assigneeName:realAgent.name}
    ]};
    live.realDetailId='real-anim-test';
    app.renderer.renderBoard();
    app.renderer.renderRoster();
    await wait(150);
    check('real board mission focus',!!$('.real-board-focus'));
    check('real board task rows',$$('.real-focus-task').length>=2);
    check('real roster member task',/真实任务动画/.test(($('.external-card.mission-active .team-state')||{}).textContent||''));
    const fakeMission={id:'real-anim-test',title:'真实动画测试',archived:false,
      stats:{tasks:8,done:2,progress:25,approvals:0},members:[realAgent]};
    live.applyOverview({approvals:[],missions:[Object.assign({},fakeMission,{discussion:{status:'running'},
      autoRun:{status:'discussing',currentAgentId:'',completed:2,total:8}})]});
    await wait(200);
    check('real meeting choreography',!!$('.real-char.state-meeting'));
    check('real meeting one speaker',$$('.real-char.state-meeting .rc-bubble.show').length<=1);
    live.applyOverview({approvals:[],missions:[Object.assign({},fakeMission,{
      autoRun:{status:'waiting_boss',currentAgentId:realAgent.id,currentTaskTitle:'等待决策',completed:2,total:8}})]});
    await wait(200);
    check('real waiting-boss choreography',!!$('.real-char.state-blocked'));
    check('real waiting-boss bubble',/审批/.test(($('.real-char.state-blocked .rc-bubble.show')||{}).textContent||''));
    live.applyOverview({approvals:[],missions:[Object.assign({},fakeMission,{
      stats:{tasks:8,done:8,progress:100,approvals:0},
      autoRun:{status:'done',currentAgentId:'',completed:8,total:8}})]});
    await wait(200);
    check('real celebration choreography',!!$('.real-char.state-celebrating'));
    check('real completion cinema',!!$('.real-cinema.kind-done'));
    check('real confetti burst',$$('.real-confetti').length>0);
    check('real celebration in roster',/任务完成/.test(($('.external-card.mission-active .team-state')||{}).textContent||''));
    await live.poll();
    await wait(350);
    const idleStates = $$('.real-char.state-idle, .real-char.state-reviewing, .real-char.state-coffee, .real-char.state-chatting').length;
    check('real idle choreography alive',idleStates>=1);
    check('real feed filter tabs',$$('.real-feed-filters button').length>=5);
    check('real feed real event rows',$$('.real-feed-row.kind-task, .real-feed-row.kind-artifact, .real-feed-row.kind-model').length>=1);
    check('office title becomes real ops',($('#officeName')||{}).textContent==='REAL OPS');
    check('team subtitle says real mode',/真实模式|Real mode/.test(($('#teamSub')||{}).textContent||''));
    check('real board rendered',!!$('.real-board'));
    check('real feed rendered',!!$('.real-feed-list')||!!$('.real-feed-empty'));
    check('board title changed',($('#boardTitle')||{}).textContent==='REAL BOARD');
    check('feed title changed',($('#feedTitle')||{}).textContent==='LIVE FEED');
    check('real board empty state or missions',!!$('.real-mission-row')||!!$('.real-board-empty'));
    check('real mode live panel',!!$('#realModeLive'));
    $('#realOpsBtn').click();
    await wait(300);
    check('real panel opens from topbar',!!$('#realModeCover')&&!$('#realModeCover').hidden);
    check('cover text',/真实运营模式|Real operations/.test(($('#realModeCover')||{}).textContent||''));
    check('cover keeps product promise',/谁在干|Who's on it/.test(($('#realModeCover')||{}).textContent||''));
    check('real mode create action',!!$('#realModeCover [data-real-create-mission]'));
    check('real mode AI action',!!$('#realModeCover [data-real-open-ai]'));
    const openFromCover=$('#realModeCover [data-real-open-missions]');
    if(openFromCover){
      openFromCover.click();
      await wait(600);
      check('cover opens mission center',!!$('#missionLab')&&!$('#missionLab').hidden);
      app.renderer.missions.close();
      await wait(150);
    }
    const createFromCover=$('#realModeCover [data-real-create-mission]');
    if(createFromCover){
      createFromCover.click();
      await wait(500);
      check('cover opens mission form',!!$('#missionCreateForm'));
      app.renderer.missions.close();
      await wait(150);
    }

    const coverClose=$('#realModeCover [data-real-cover-close]');
    check('cover close control',!!coverClose);
    if(coverClose){
      coverClose.click();
      await wait(300);
      check('cover closes without restoring demo',demo.enabled===false&&$('#realModeCover').hidden);
      check('cover dismissal persisted',w.localStorage.getItem('agent-office.real-cover-dismissed.v1')==='1');
      check('real mode stays paused',app.engine.paused===true);
      check('real panel topbar button visible',!!$('#realOpsBtn')&&!$('#realOpsBtn').hidden);
      const stageNote=$('#realStageNote');
      const hasMissions=!!$('.real-mission-row');
      check('stage note suppressed once missions exist',hasMissions?!!stageNote&&stageNote.hidden:!!stageNote&&!stageNote.hidden);
      check('topbar reopens mission center',!!$('#realMissionBtn')&&!$('#realMissionBtn').hidden);
      check('real morale has value',!/—/.test(($('#teamMorale')||{}).textContent||''),($('#teamMorale')||{}).textContent);
      check('real top stats visible',w.getComputedStyle($('.top-stats')).display!=='none');
      check('real stats relabeled',/任务/.test(($('#statLabelTasks')||{}).textContent||''));
      check('real feed has rows or empty state',!!$('.real-feed-row')||!!$('.real-feed-empty'));
      const noteClose=$('[data-real-stage-note-close]');
      if(noteClose){noteClose.click();await wait(100);check('stage note closes',!!$('#realStageNote')&&$('#realStageNote').hidden);}
      check('real panel button label reopens',/面板/.test($('#realOpsBtn').textContent));
      $('#realOpsBtn').click();
      await wait(300);
      check('real panel button reopens cover',!$('#realModeCover').hidden);
      check('real panel button label closes',$('#realOpsBtn').getAttribute('aria-expanded')==='true');
      check('stage note hides when panel opens',!!$('#realStageNote')&&$('#realStageNote').hidden);
      check('real mode mission center button',!!$('#realMissionBtn')&&!$('#realMissionBtn').hidden);
      $('#realModeCover [data-real-cover-close]').click();
      await wait(200);
    }

    app.renderer.features.settings.open('demo');
    await wait(120);
    check('settings demo section',!!$('#settingsDemo'));
    const toggle=$('[data-settings-demo]');
    check('settings demo toggle exists',!!toggle);
    check('settings toggle reflects off',!!toggle&&toggle.checked===false);
    check('settings clean action',!!$('[data-settings-demo-clean]'));
    app.renderer.features.settings.close();

    if(app.renderer.update){
      app.renderer.update.open();
      await wait(400);
      check('tools demo block',!!$('.tools-demo'));
      check('tools demo toggle',!!$('[data-demo-tool="toggle"]'));
      check('tools demo clean',!!$('[data-demo-tool="clean"]'));
      app.renderer.update.close();
    }

    const missions=app.renderer.missions;
    if(missions){
      await missions.open();
      missions.openForm('mission');
      await wait(1200);
      check('mission directory real only',(missions.data.agents||[]).length>0?
        (missions.data.agents||[]).every(a=>a.source==='external'):true,
        (missions.data.agents||[]).map(a=>a.source).join(','));
      check('real-only form hint',!!$('.mission-real-mode-note'));
      check('real-only picker or empty state',!!$('.mission-agent-pick')||!!$('.mission-real-empty'));
      missions.formMode='';missions.render();
      missions.close();
      await wait(200);
    }

    demo.setEnabled(true,{silent:true});
    await wait(500);
    check('html marks demo on',d.documentElement.dataset.demo==='on');
    check('cover hidden again',!!$('#realModeCover')&&$('#realModeCover').hidden);
    check('real office agents cleared',$$('.real-char').length===0);
    check('preset team cards restored',$$('.team-card[data-agent]').length>=6);
    check('char layer visible again',w.getComputedStyle($('.char-layer')).display!=='none');
    check('board title restored',($('#boardTitle')||{}).textContent==='SPRINT BOARD');
    check('real feed removed on restore',!$('.real-feed-empty')&&!$('.real-feed-list'));
    check('simulation feed restored',$$('.feed-row').length>0);
    check('simulation resumed',app.engine.paused===false);
    try { localStorage.setItem('agent-office.demo-mode.v1','on'); } catch (err) {}
    finish();
  }
})();
</script></body></html>
