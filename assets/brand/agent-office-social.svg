<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="aoSocialTitle aoSocialDesc">
  <title id="aoSocialTitle">Agent Office — a local-first pixel office for AI teams</title>
  <desc id="aoSocialDesc">Agent Office — SEE THE TEAM. SHIP THE WORK.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2030"/><stop offset="0.55" stop-color="#081520"/><stop offset="1" stop-color="#050d14"/>
    </linearGradient>
    <radialGradient id="teal" cx="0.2" cy="0.2" r="0.65">
      <stop offset="0" stop-color="#55d6c2" stop-opacity="0.16"/><stop offset="1" stop-color="#55d6c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#f2b544" stop-opacity="0.12"/><stop offset="1" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#050d14"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#teal)"/>
  <rect width="1200" height="630" fill="url(#amber)"/>
  <g stroke="#55d6c2" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M0 360H1200M0 420H1200M0 480H1200M0 540H1200M0 600H1200"/>
